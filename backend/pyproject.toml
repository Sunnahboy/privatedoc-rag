[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.138.2",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.18.0",
    "rapidocr-onnxruntime>=1.3.0",
    "sqlalchemy>=2.0.51",
    "tantivy>=0.26.0",
    "uvicorn[standard]>=0.49.0",
    "torch",
    "torchvision",
    "numpy",
    "onnxruntime-gpu==1.19.2",
    "alembic>=1.19.0",
    "flashrank>=0.2.10",
    "aio-pika>=10.0.1",
    "asyncpg>=0.31.0",
    "tenacity>=9.1.4",
    "tokenizers<=0.23.0",
    "colpali-engine>=0.3.0",
    "docling",
    "langchain-text-splitters>=1.1.2",
    "bitsandbytes>=0.46.1",
    "sse-starlette>=3.4.8",
    "redis>=8.1.0",
    "fastembed>=0.8.0",
    "pyjwt>=2.14.0",
    "cryptography>=50.0.1",
]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", 
    "fastapi.Query", 
    "fastapi.Path", 
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security"
]
[tool.setuptools.packages.find]
exclude = ["alembic*"]
[tool.uv]



