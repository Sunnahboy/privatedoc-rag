services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: privatedoc_rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: privatedoc_qdrant
    ports:
      - "127.0.0.1:7000:6333"    # REST API 
      - "127.0.0.1:7001:6334"    # gRPC API 
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  rabbitmq_data:
  qdrant_data: